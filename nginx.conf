worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # 🎬 MainSite (前端 + API 聚合)
    server {
        listen 8980;
        server_name zhuiying.19856789.xyz;

        location / {
            proxy_pass http://zhuiying-mainsite:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 🚀 Unified Hub (TMDB + SearchAggregator)
    server {
        listen 80;
        server_name zhuiyinghub.19856789.xyz zhuiyingdb.19856789.xyz zhuiyingapi.19856789.xyz;

        location / {
            proxy_pass http://zhuiying-hub:5002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # PanSou (Internal/Backup)
    server {
        listen 80;
        server_name zhuiyingsou.19856789.xyz;

        location / {
            proxy_pass http://zhuiying-pansou:8888;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
