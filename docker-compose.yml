services:
  nginx:
    image: nginx:alpine
    container_name: zhuiying-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    depends_on:
      - mainsite
      - zhuiyinghub
    networks:
      - dacongming

  zhuiyinghub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: Hub
    container_name: zhuiying-hub
    ports:
      - "5002:5002"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - ASPNETCORE_URLS=http://0.0.0.0:5002
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COOKIE_ENCRYPTION_KEY=${COOKIE_ENCRYPTION_KEY}
    volumes:
      - tmdb_data:/app/data
    restart: unless-stopped
    networks:
      - dacongming

  mainsite:
    build:
      context: .
      dockerfile: src/Zhuiying.MainSite/Dockerfile
    container_name: zhuiying-mainsite
    ports:
      - "5000:80"
    environment:
      - HUB_URL=${HUB_URL}
    restart: unless-stopped
    networks:
      - dacongming

  tgbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: TgBot
    container_name: zhuiying-tgbot
    environment:
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - MAIN_SITE_URL=http://zhuiying-mainsite:5000
    restart: unless-stopped
    depends_on:
      - mainsite
    networks:
      - dacongming

volumes:
  tmdb_data:

networks:
  dacongming:
    external: true
