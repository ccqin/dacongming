services:
  nginx:
    image: nginx:alpine
    container_name: zhuiying-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    depends_on:
      - mainsite
      - zhuiyinghub
    networks:
      - limitless

  zhuiyinghub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: Hub
    container_name: zhuiying-hub
    expose:
      - "5002"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - ASPNETCORE_URLS=http://0.0.0.0:5002
    volumes:
      - tmdb_data:/app/data
    restart: unless-stopped
    networks:
      - limitless

  mainsite:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: MainSite
    container_name: zhuiying-mainsite
    expose:
      - "5000"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ZhuiyingHubUrl=${HUB_URL}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: unless-stopped
    networks:
      - limitless

  tgbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: TgBot
    container_name: zhuiying-tgbot
    environment:
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - MAIN_SITE_URL=http://zhuiying-mainsite:5000
    restart: unless-stopped
    depends_on:
      - mainsite
    networks:
      - limitless

volumes:
  tmdb_data:

networks:
  limitless:
    external: true
