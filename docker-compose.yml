services:
  nginx:
    image: nginx:alpine
    container_name: zhuiying-nginx
    ports:
      - "8980:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - mainsite
    networks:
      - zhuiying-net

  zhuiyinghub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: Hub
    container_name: zhuiying-hub
    ports:
      - "5002:5002"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - ASPNETCORE_URLS=http://0.0.0.0:5002
    volumes:
      - tmdb_data:/app/data
    restart: unless-stopped
    networks:
      - zhuiying-net

  mainsite:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: MainSite
    container_name: zhuiying-mainsite
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ZhuiyingHubUrl=https://zhuiyinghub.19856789.xyz
      - ADMIN_USER=ccqin
      - ADMIN_PASSWORD=bukeshuo123!
    restart: unless-stopped
    networks:
      - zhuiying-net

volumes:
  tmdb_data:

networks:
  zhuiying-net:
    driver: bridge
