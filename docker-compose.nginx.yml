# Nginx 反向代理服务 - 启动: docker compose -f docker-compose.nginx.yml up -d
services:
  nginx:
    image: nginx:alpine
    container_name: zhuiying-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - dacongming

networks:
  dacongming:
    external: true
