<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>追影 | Zhuiying</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; background: rgba(15,23,42,0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #334155; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
        .nav-btn { background: var(--card); color: var(--text); border: 1px solid #475569; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; position: relative; }
        .nav-btn:hover { background: #334155; }
        .dropdown { display: none; position: absolute; top: 110%; right: 0; background: var(--card); border: 1px solid #475569; border-radius: 8px; min-width: 120px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 101; }
        .dropdown a { display: block; padding: 0.5rem 1rem; color: var(--text); text-decoration: none; cursor: pointer; }
        .dropdown a:hover { background: #334155; }
        
        main { padding: 2rem 0; }
        .hero { width: 90%; margin: 0 auto 2rem; border-radius: 16px; overflow: hidden; position: relative; height: 40vh; min-height: 250px; }
        .hero img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
        .hero-content { position: absolute; bottom: 2rem; left: 2rem; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .category { margin-bottom: 2.5rem; width: 90%; margin-left: auto; margin-right: auto; }
        .category h2 { font-size: 1.2rem; margin: 0 0 1rem 0; color: var(--accent); }
        .scroll-list { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .scroll-list::-webkit-scrollbar { height: 6px; }
        .scroll-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .card { flex: 0 0 140px; scroll-snap-align: start; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; }
        .card p { font-size: 0.8rem; margin-top: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* 加载状态样式 */
        .loading-state { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; }
        .loading-card { flex: 0 0 140px; height: 210px; background: #334155; border-radius: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        
        .error { color: #ef4444; padding: 1rem; background: rgba(239, 68, 68, 0.1); border-radius: 8px; }
        
        #login-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
        .modal { background: var(--card); padding: 2rem; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
        .modal input { width: 100%; padding: 0.8rem; margin: 0.5rem 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; }
        .modal button { width: 100%; padding: 0.8rem; background: var(--accent); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        .close-modal { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        
        .loading { text-align: center; padding: 3rem; color: var(--muted); }
        .error { text-align: center; padding: 2rem; color: #ef4444; }
    </style>
</head>
<body>
    <header>
        <div class="logo">追影</div>
        <div style="display: flex; align-items: center; gap: 0.5rem; flex: 1; justify-content: center; max-width: 400px; margin: 0 1rem;">
            <input id="search-input" type="text" placeholder="搜索网盘资源..." style="flex: 1; padding: 0.5rem 0.8rem; background: var(--card); border: 1px solid #475569; color: white; border-radius: 6px; font-size: 0.9rem;">
            <button id="search-btn" class="nav-btn" style="padding: 0.5rem 1rem;">搜索</button>
        </div>
        <div id="user-area">
            <button id="auth-btn" class="nav-btn">登录</button>
            <div id="user-menu" class="dropdown">
                <a onclick="toggleAdminModal()">管理后台</a>
                <a onclick="logout()">退出登录</a>
            </div>
        </div>
    </header>

    <main>
        <div class="hero">
            <img id="hero-img" src="https://image.tmdb.org/t/p/original/8uVKlOJUhOeUv5F9Gn1p8nXk9gP.jpg" alt="Hero">
            <div class="hero-content">
                <h1 id="hero-title">正在加载...</h1>
                <p id="hero-desc" style="color: #cbd5e1; max-width: 600px;">海量影视资源，一键搜索</p>
            </div>
        </div>

        <div id="categories"></div>
    </main>

    <div id="login-modal">
        <div class="modal">
            <button class="close-modal" onclick="closeLogin()">&times;</button>
            <h2 style="margin-bottom: 1rem;">用户登录</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button onclick="doLogin()">登录</button>
            <p id="login-msg" style="margin-top: 1rem; font-size: 0.8rem;"></p>
        </div>
    </div>

    <script>
        const API = '';
        let token = localStorage.getItem('token');
        
        let currentUser = null;
        async function init() {
            currentUser = await checkAuth();
            const btn = document.getElementById('auth-btn');
            const menu = document.getElementById('user-menu');
            
            btn.textContent = currentUser ? currentUser : '登录';
            if (currentUser) {
                btn.onclick = () => menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            } else {
                btn.onclick = () => openLogin();
            }
            loadCategories();
            setupSearch();
        }

        // 搜索功能 (POST /api/search)
        function setupSearch() {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            if (!searchBtn || !searchInput) return;

            searchBtn.onclick = async () => {
                const keyword = searchInput.value.trim();
                if (!keyword) return;
                searchBtn.textContent = '搜索中...';
                searchBtn.disabled = true;

                try {
                    const res = await fetch(`${API}/api/search`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ keyword: keyword, cloudTypes: [], forceRefresh: false })
                    });
                    const data = await res.json();
                    showSearchResults(keyword, data);
                } catch (e) {
                    showSearchResults(keyword, { success: false, error: '搜索失败: ' + e.message });
                } finally {
                    searchBtn.textContent = '搜索';
                    searchBtn.disabled = false;
                }
            };

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') searchBtn.click();
            });
        }

        function showSearchResults(keyword, data) {
            let resultsDiv = document.getElementById('search-results');
            if (!resultsDiv) {
                resultsDiv = document.createElement('div');
                resultsDiv.id = 'search-results';
                resultsDiv.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; display: flex; justify-content: center; align-items: flex-start; padding: 3rem; overflow-y: auto;';
                document.body.appendChild(resultsDiv);
            }

            resultsDiv.innerHTML = `
                <div class="modal" style="max-width: 700px; width: 100%; max-height: 80vh; overflow-y: auto;">
                    <h2>搜索结果: ${keyword}</h2>
                    <button onclick="document.getElementById('search-results').remove()" style="margin-top: 0.5rem;">关闭</button>
                    <div id="search-results-content" style="margin-top: 1rem; text-align: left;"></div>
                </div>
            `;

            const contentDiv = resultsDiv.querySelector('#search-results-content');
            if (data.success && Array.isArray(data.data) && data.data.length > 0) {
                contentDiv.innerHTML = data.data.map(item => `
                    <div style="background: var(--bg); padding: 0.75rem; border-radius: 8px; margin-bottom: 0.5rem;">
                        <p><strong>网盘:</strong> ${item.cloudType}</p>
                        <p><strong>链接:</strong> <a href="${item.url}" target="_blank" style="color: var(--accent);">打开链接</a></p>
                        ${item.password ? `<p><strong>提取码:</strong> ${item.password}</p>` : ''}
                        ${item.note ? `<p><strong>备注:</strong> ${item.note}</p>` : ''}
                        ${item.source ? `<p><strong>来源:</strong> ${item.source}</p>` : ''}
                    </div>
                `).join('');
            } else {
                contentDiv.innerHTML = `<p style="color: var(--muted);">未找到相关资源 ${data.error || ''}</p>`;
            }
        }

        // 关闭下拉菜单的全局点击监听
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('user-menu');
            if (!e.target.closest('#user-area')) {
                menu.style.display = 'none';
            }
        });

        async function checkAuth() {
            if (!token) return null;
            try {
                const res = await fetch(`${API}/api/me`, { headers: { 'Authorization': `Bearer ${token}` }});
                if (!res.ok) { localStorage.removeItem('token'); return null; }
                const data = await res.json();
                return data.username;
            } catch { return null; }
        }

        async function loadCategories() {
            const cats = document.getElementById('categories');
            cats.innerHTML = ''; // 清空旧内容
            
            const types = [
                { name: '热门电影', type: 'movie', endpoint: '/api/movies?category=trending' },
                { name: '最新上架', type: 'movie', endpoint: '/api/movies?category=upcoming' },
                { name: '热门剧集', type: 'tv', endpoint: '/api/movies?category=trending' }
            ];
            
            for (const cat of types) {
                // 1. 显示加载状态
                const section = document.createElement('div');
                section.className = 'category';
                section.id = `cat-${cat.name}`;
                section.innerHTML = `
                    <h2>${cat.name}</h2>
                    <div class="scroll-list loading-state">
                        <div class="card loading-card"></div>
                        <div class="card loading-card"></div>
                        <div class="card loading-card"></div>
                        <div class="card loading-card"></div>
                        <div class="card loading-card"></div>
                    </div>
                `;
                cats.appendChild(section);

                try {
                    // Pass type parameter to MainSite backend
                    const res = await fetch(`${API}${cat.endpoint}&type=${cat.type}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    const items = parseList(data);
                    
                    if (items.length === 0) {
                        section.querySelector('.scroll-list').innerHTML = '<p style="color:var(--muted); padding:1rem;">暂无数据</p>';
                        continue;
                    }
                    
                    // 更新 Hero (仅第一个分类)
                    if (cat.name === '热门电影' && items[0].backdrop_path) {
                        document.getElementById('hero-img').src = `https://image.tmdb.org/t/p/original/${items[0].backdrop_path}`;
                        document.getElementById('hero-title').textContent = items[0].title || items[0].name;
                    }

                    // 渲染卡片 (添加点击查看详情)
                    const listHtml = items.slice(0, 15).map(i => `
                        <div class="card" onclick="showDetail(${i.tmdbId || i.id}, '${cat.type}')">
                            <img src="https://image.tmdb.org/t/p/w342${i.poster_path || i.posterPath}" loading="lazy" 
                                 onerror="this.onerror=null; this.src='https://placehold.co/140x210/1e293b/94a3b8?text=No+Image'; this.style.objectFit='contain'">
                            <p>${i.title || i.name}</p>
                        </div>
                    `).join('');
                    
                    section.querySelector('.scroll-list').innerHTML = listHtml;

                } catch (e) {
                    section.querySelector('.scroll-list').innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
                }
            }
        }

        function parseList(data) {
            if (Array.isArray(data)) return data;
            if (data.results && Array.isArray(data.results)) return data.results;
            if (data.data && Array.isArray(data.data)) return data.data;
            return [];
        }

        function openLogin() { document.getElementById('login-modal').style.display = 'flex'; }
        function closeLogin() { document.getElementById('login-modal').style.display = 'none'; }
        
        async function doLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const msg = document.getElementById('login-msg');
            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    closeLogin();
                    location.reload();
                } else {
                    msg.textContent = data.message || '登录失败';
                    msg.style.color = '#ef4444';
                }
            } catch { msg.textContent = '网络错误'; }
        }

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }

        function toggleAdminModal() {
            document.getElementById('user-menu').style.display = 'none';
            const adminModal = document.getElementById('admin-modal') || document.createElement('div');
            if (!document.getElementById('admin-modal')) {
                adminModal.id = 'admin-modal';
                adminModal.innerHTML = `
                    <div class="modal" style="max-width: 500px; max-height: 80vh; overflow-y: auto;">
                        <h2>管理后台</h2>
                        <div id="admin-stats" style="margin: 1rem 0; text-align: left; font-family: monospace; white-space: pre-wrap; word-break: break-all;">加载中...</div>
                        <button onclick="document.getElementById('admin-modal').style.display='none'">关闭</button>
                    </div>`;
                document.body.appendChild(adminModal);
                adminModal.style.cssText = 'display: flex; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center;';
                
                // Hub API.md 中没有 /stats，但有 /sources。我们展示 sources 来证明连通性。
                fetch(`${API}/api/admin/sources`, { headers: { 'Authorization': `Bearer ${token}` }})
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        document.getElementById('admin-stats').innerHTML = `
                            <p><strong> 管理接口连通成功！</strong></p>
                            <p>当前数据源配置:</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                    })
                    .catch(err => {
                        document.getElementById('admin-stats').innerHTML = `
                            <p style="color: #ef4444">❌ 加载失败: ${err.message}</p>
                            <p>请检查 Hub 服务是否在线。</p>
                        `;
                    });
            }
            adminModal.style.display = 'flex';
        }

        // 影视详情弹窗
        async function showDetail(tmdbId, type = 'movie') {
            let detailModal = document.getElementById('detail-modal');
            if (!detailModal) {
                detailModal = document.createElement('div');
                detailModal.id = 'detail-modal';
                detailModal.style.cssText = 'display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 250; justify-content: center; align-items: center; overflow-y: auto;';
                detailModal.innerHTML = `
                    <div class="modal" style="max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto;">
                        <div id="detail-content"></div>
                        <button onclick="closeDetailModal()" style="margin-top: 1rem;">关闭</button>
                    </div>
                `;
                document.body.appendChild(detailModal);
            }
            
            detailModal.style.display = 'flex';
            document.getElementById('detail-content').innerHTML = '<p style="text-align: center; padding: 2rem;">加载中...</p>';

            try {
                const res = await fetch(`${API}/api/movies/${tmdbId}?type=${type}`);
                const data = await res.json();
                renderDetailModal(tmdbId, type, data);
            } catch (e) {
                document.getElementById('detail-content').innerHTML = `<p style="color: #ef4444;">加载失败: ${e.message}</p>`;
            }
        }

        function renderDetailModal(tmdbId, type, data) {
            const item = data.results?.[0] || data.data || {};
            const content = document.getElementById('detail-content');
            
            if (!item.title && !item.tmdbId) {
                content.innerHTML = '<p style="color: var(--muted);">暂无详情数据</p>';
                return;
            }

            let html = `
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <img src="https://image.tmdb.org/t/p/w300${item.posterPath || item.poster_path || ''}" 
                         style="width: 120px; border-radius: 8px; flex-shrink: 0;" 
                         onerror="this.style.display='none'">
                    <div>
                        <h2>${item.title || item.name || '未知'}</h2>
                        ${item.releaseDate ? `<p style="color: var(--muted);">${item.releaseDate} | 评分 ${item.tmdbVoteAverage || item.voteAverage || 'N/A'}</p>` : ''}
                        ${item.overview ? `<p style="margin-top: 0.5rem; font-size: 0.9rem; line-height: 1.5;">${item.overview}</p>` : ''}
                    </div>
                </div>
            `;

            // 豆瓣信息
            if (item.douban) {
                html += `
                    <div style="background: var(--bg); padding: 0.75rem; border-radius: 8px; margin-top: 0.5rem;">
                        <h3 style="font-size: 1rem; margin-bottom: 0.5rem;">豆瓣信息</h3>
                        <p>评分: ${item.douban.rating || 'N/A'} (${item.douban.ratingCount || 0} 人)</p>
                        ${item.douban.summary ? `<p style="font-size: 0.85rem; margin-top: 0.25rem;">${item.douban.summary}</p>` : ''}
                    </div>
                `;
            }

            // 搜索资源按钮
            html += `
                <button onclick="searchForResource('${item.title || item.name}')" 
                        style="width: 100%; margin-top: 0.5rem; padding: 0.75rem; background: var(--accent); color: var(--bg); border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold;">
                    🔍 搜索网盘资源
                </button>
            `;

            content.innerHTML = html;
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            if (modal) modal.style.display = 'none';
        }

        async function searchForResource(title) {
            closeDetailModal();
            // 复用搜索逻辑
            const res = await fetch(`${API}/api/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keyword: title, cloudTypes: [], forceRefresh: false })
            });
            const data = await res.json();
            showSearchResults(title, data);
        }

        init();
    </script>
</body>
</html>
