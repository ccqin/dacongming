server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM 路由 - 所有请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blazor _framework 目录 — 短缓存（blazor.webassembly.js 和 dotnet.js 没有 content hash）
    location /_framework/ {
        expires 0;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源缓存（带 content hash 的文件可以长期缓存）
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Blazor WASM 特定文件（带 content hash，可安全长缓存）
    location ~* \.(dll|dat|pdb|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;
}
