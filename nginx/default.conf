server {
    listen 80;
    server_name zhuiying.19856789.xyz;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_mainsite zhuiying-mainsite;
        proxy_pass http://$upstream_mainsite:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name zhuiyinghub.19856789.xyz;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_hub zhuiying-hub;
        proxy_pass http://$upstream_hub:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Default fallback to MainSite
server {
    listen 80 default_server;
    server_name _;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_mainsite zhuiying-mainsite;
        proxy_pass http://$upstream_mainsite:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
