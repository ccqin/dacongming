server {
    listen 80;
    server_name zhuiying.19856789.xyz;

    # Blazor _framework 文件 — 强制 no-cache（防止 Cloudflare 缓存旧版）
    location /_framework/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_mainsite zhuiying-mainsite;
        proxy_pass http://$upstream_mainsite:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 覆盖上游缓存头，强制 Cloudflare 不缓存
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_mainsite zhuiying-mainsite;
        proxy_pass http://$upstream_mainsite:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name zhuiyinghub.19856789.xyz;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_hub zhuiying-hub;
        proxy_pass http://$upstream_hub:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Default fallback to MainSite
server {
    listen 80 default_server;
    server_name _;

    location /_framework/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_mainsite zhuiying-mainsite;
        proxy_pass http://$upstream_mainsite:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_mainsite zhuiying-mainsite;
        proxy_pass http://$upstream_mainsite:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
