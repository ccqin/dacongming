server {
    listen 80;
    server_name zhuiying.19856789.xyz;

    location / {
        proxy_pass http://zhuiying-mainsite:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name zhuiyinghub.19856789.xyz;

    location / {
        proxy_pass http://zhuiying-hub:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Default fallback to MainSite
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://zhuiying-mainsite:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
